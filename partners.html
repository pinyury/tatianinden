<style>
/* ==============================================================
   Design‑tokens from the main site (adjust if they change there)
   ============================================================== */
:root{
  --tiffany:#0ABAB5;
  --tiffany-light:#7FE0DC;
  --tiffany-soft:#D7F5F3;
  --tiffany-deep:#06877F;

  --pink:#FF6FA9;
  --pink-soft:#FFD6E8;
  --pink-cloud:#FFEAF3;
  --pink-deep:#D44A85;

  --gold:#C9A961;
  --gold-light:#E8CF8E;
  --gold-deep:#9A7E3D;

  --white:#FFFFFF;
  --ink:#1B1B2E;
  --ink-soft:#4A4A5E;
  --ink-mute:#8A8A9C;

  --radius:18px;
  --shadow-soft:0 10px 30px -12px rgba(10,186,181,.18);
  --shadow-md:0 20px 50px -20px rgba(27,27,46,.18);
}

/* --------------------------------------------------------------
   Global page styling (keep it minimal – rest is on the main site)
   -------------------------------------------------------------- */
body{
  margin:0;
  font-family:"Manrope",Arial,sans-serif;
  background:#F8F9FA;
  color:var(--ink);
}
.container{
  max-width:1240px;
  margin:auto;
  padding:40px 20px;
}

/* ------- Partners section ------- */
.partners .section-head{
  text-align:center;
  margin-bottom:48px;
}
.partners .section-head .eyebrow{
  display:inline-block;
  font-size:13px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--gold-light);
  margin-bottom:12px;
}
.partners .section-head h2{
  font-family:"Cormorant Garamond",serif;
  font-size:clamp(34px,4vw,48px);
  color:var(--ink);
  margin:0 0 12px;
}
.partners .section-head p.lead{
  max-width:720px;
  margin:auto;
  font-size:1rem;
  line-height:1.6;
}

/* Swiper container */
.partners .swiper{
  width:100%;
  padding:12px 0;
}

/* Slides */
.partners .swiper-slide{
  background:var(--white);
  border-radius:var(--radius);
  box-shadow:var(--shadow-soft);
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:28px 20px;
  transition:transform .35s ease,box-shadow .35s;
}
.partners .swiper-slide:hover{
  transform:translateY(-6px);
  box-shadow:var(--shadow-md);
}

/* Logo */
.partners .partner-logo{
  max-width:140px;
  max-height:80px;
  margin-bottom:12px;
  filter:grayscale(30%) opacity(.85);
  transition:filter .3s,opacity .3s;
}
.partners .swiper-slide:hover .partner-logo{
  filter:none;
  opacity:1;
}

/* Name */
.partners .partner-name{
  font-family:"Cormorant Garamond",serif;
  font-size:1.2rem;
  color:var(--ink);
  margin-bottom:6px;
}

/* Type badge */
.partners .partner-type{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  background:linear-gradient(135deg,var(--tiffany),var(--pink));
  color:#fff;
  font-size:12px;
  font-weight:600;
}

/* Navigation arrows */
.partners .swiper-button-next,
.partners .swiper-button-prev{
  color:var(--tiffany);
  width:44px; height:44px;
  background:var(--white);
  border-radius:50%;
  box-shadow:var(--shadow-soft);
}
.partners .swiper-button-next:hover,
.partners .swiper-button-prev:hover{
  background:var(--tiffany-light);
  color:#fff;
}

/* Pagination bullets */
.partners .swiper-pagination-bullet{
  background:rgba(27,27,46,.2);
}
.partners .swiper-pagination-bullet-active{
  background:var(--tiffany);
}

/* Hide arrows on very small screens */
@media (max-width:560px){
  .partners .swiper-button-next,
  .partners .swiper-button-prev{display:none;}
}

/* Responsive slide width (fallback for non‑JS environments) */
@media (min-width:1200px){
  .partners .swiper-slide{width:calc((100% - 3*24px)/4);} /* 4 cols */
}
@media (min-width:768px) and (max-width:1199px){
  .partners .swiper-slide{width:calc((100% - 1*24px)/2);} /* 2 cols */
}
@media (max-width:767px){
  .partners .swiper-slide{width:100%;} /* 1 col */
}

/* Call‑to‑action button (same style as main site) */
.partners .cta{
  text-align:center;
  margin-top:32px;
}
.partners .cta .btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(135deg,var(--tiffany),var(--pink));
  color:#fff;
  padding:12px 24px;
  border-radius:999px;
  font-weight:600;
  text-decoration:none;
  cursor:pointer;
}
.partners .cta .btn:hover{
  transform:translateY(-2px);
}
</style>

<body>

<!-- ==== Swiper JS (CDN) ==== -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<!-- Partner data (embedded JSON) -->
<script type="application/json" id="partners-data">
[
  {
    "name": "Танцевальная академия «Грация»",
    "url": "https://gracia-dance.ru",
    "logo": "https://tatianinden.ru/partners/logos/gracia.svg",
    "type": "Спонсор",
    "desc": "Помогает с арендой зала и участвует в конкурсных проектах."
  },
  {
    "name": "Мастерская «Танцевая одежда»",
    "url": "https://dancewear.ru",
    "logo": "https://tatianinden.ru/partners/logos/dancewear.svg",
    "type": "Поставщик",
    "desc": "Скидки до 30 % на форму и обувь для наших учеников."
  },
  {
    "name": "Фото‑студия «Светляк»",
    "url": "https://svetljak-photo.ru",
    "logo": "https://tatianinden.ru/partners/logos/svetlyak.svg",
    "type": "Сервис",
    "desc": "Профессиональные репортажи наших выступлений."
  }
]
</script>

<script>
(() => {
  const wrapper = document.getElementById('partnersWrapper');
  const raw = document.getElementById('partners-data').textContent.trim();
  let partners = [];

  try {
    partners = JSON.parse(raw);
  } catch (e) {
    console.error('Невозможно распарсить JSON партнёров', e);
  }

  // Render each partner as a Swiper slide
  const renderSlide = p => {
    const slide = document.createElement('div');
    slide.className = 'swiper-slide';
    slide.innerHTML = `
      <a href="${p.url}" target="_blank" rel="noopener noreferrer">
        <img class="partner-logo lazyload"
             src="${p.logo}"
             alt="Логотип партнёра ${p.name}"
             loading="lazy">
        <strong class="partner-name">${p.name}</strong>
        ${p.type ? `<span class="partner-type">${p.type}</span>` : ''}
      </a>`;
    wrapper.appendChild(slide);
  };

  if (partners.length) {
    partners.forEach(renderSlide);
  } else {
    wrapper.innerHTML = '<p style="color:#D44A85;text-align:center;">Нет данных о партнёрах.</p>';
  }

  // Initialise Swiper after slides are added
  const partnersSwiper = new Swiper('.partners-swiper', {
    slidesPerView: 1,
    spaceBetween: 24,
    loop: true,
    grabCursor: true,
    pagination: { el: '.swiper-pagination', clickable: true },
    navigation: {
      nextEl: '.swiper-button-next',
      prevEl: '.swiper-button-prev',
    },
    breakpoints: {
      768: { slidesPerView: 2 },
      1200: { slidesPerView: 4 }
    },
    preloadImages: false,
    lazy: { loadPrevNext: true, loadOnTransitionStart: true },
    a11y: {
      enabled: true,
      prevSlideMessage: 'Предыдущий слайд',
      nextSlideMessage: 'Следующий слайд',
      paginationBulletMessage: 'Перейти к слайду {{index}}'
    },
    speed: 560
  });
})();
</script>
