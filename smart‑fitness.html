<style>
:root{
  --tiffany:#0ABAB5;      --tiffany-light:#7FE0DC;
  --tiffany-soft:#D7F5F3; --tiffany-deep:#06877F;
  --pink:#FF6FA9;        --pink-soft:#FFD6E8;
  --pink-cloud:#FFEAF3;  --pink-deep:#D44A85;
  --gold:#C9A961;        --gold-light:#E8CF8E;
  --gold-deep:#9A7E3D;
  --white:#FFF;          --cream:#FFFBF6;
  --paper:#FBF7F2;
  --ink:#1B1B2E;         --ink-soft:#4A4A5E;
  --ink-mute:#8A8A9C;
  --display:"Cormorant Garamond","Times New Roman",serif;
  --body:"Manrope",Arial,sans-serif;
  --script:"Caveat","Brush Script MT",cursive;
  --container:1440px;
  --radius-sm:12px; --radius:20px; --radius-lg:32px;
  --shadow-soft:0 10px 30px -12px rgba(10,186,181,.18),0 6px 18px -10px rgba(255,111,169,.12);
  --shadow-md:0 20px 50px -20px rgba(27,27,46,.18);
  --shadow-gold:0 18px 40px -18px rgba(201,169,97,.45);
}

/* reset & utils */
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--cream);overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}

/* header */
header.nav{
  position:fixed;top:0;left:0;right:0;z-index:50;padding:10px 0;
  background:#FFF;border-bottom:1px solid rgba(27,27,46,.06);
  box-shadow:0 2px 16px -10px rgba(27,27,46,.15);
  transition:padding .3s,box-shadow .3s;
}
header.nav.scrolled{padding:8px 0;box-shadow:0 6px 24px -14px rgba(27,27,46,.2)}
.nav-row{
  display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:88px;
}
.logo{
  display:flex;align-items:center;gap:18px;color:var(--ink);line-height:1;
}
.logo-img{
  width:88px;height:88px;object-fit:contain;border-radius:50%;
  transition:transform .4s;
}
.logo:hover .logo-img{transform:rotate(-4deg)scale(1.05)}
.logo-text{display:flex;flex-direction:column;gap:3px}
.logo-text strong{
  font-family:var(--display);font-size:28px;font-weight:600;color:#1B2A4E;line-height:1;
}
.logo-text small{
  font-family:var(--body);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-mute);font-weight:500;
}
@media (max-width:960px){
  .logo-img{width:64px;height:64px}
  .logo-text strong{font-size:22px}
  .nav-row{min-height:72px}
}
@media (max-width:560px){
  .logo-img{width:52px;height:52px}
  .logo-text strong{font-size:18px}
  .logo-text small{font-size:10px}
}

/* navigation */
nav.menu{
  display:flex;gap:28px;align-items:center;white-space:nowrap;
}
nav.menu a{
  font-size:15.5px;font-weight:600;color:var(--ink-soft);
  padding:6px 2px;position:relative;transition:color .25s;
}
nav.menu a:hover{color:var(--tiffany-deep)}
nav.menu a::after{
  content:"";position:absolute;left:0;right:0;bottom:-6px;
  height:2px;background:var(--gold);border-radius:2px;
  transform:scaleX(0);transform-origin:left;transition:transform .3s;
}
nav.menu a:hover::after{transform:scaleX(1)}
nav.menu a.nav-blog{
  color:var(--gold-deep);font-weight:700;position:relative;
}
nav.menu a.nav-blog::before{
  content:"🔍";color:var(--gold);margin-right:5px;font-size:.85em;
}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:16px 28px;min-height:48px;border-radius:999px;
  font-weight:600;font-size:15px;letter-spacing:.01em;
  transition:all .35s cubic-bezier(.2,.7,.3,1);white-space:nowrap;
  position:relative;overflow:hidden;
}
.btn-primary{
  background:linear-gradient(135deg,var(--tiffany)0%,var(--pink)110%);
  color:#fff;box-shadow:0 14px 30px -12px rgba(10,186,181,.55),0 8px 20px -10px rgba(255,111,169,.5);
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 20px 40px -14px rgba(10,186,181,.7),0 12px 24px -10px rgba(255,111,169,.6);
}
.btn-primary::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,transparent30%,rgba(255,255,255,.35)50%,transparent70%);
  transform:translateX(-100%);transition:transform .8s cubic-bezier(.2,.7,.3,1);
}
.btn-primary:hover::after{transform:translateX(100%)}
.btn-ghost{
  background:transparent;color:var(--ink);
  border:1.5px solid rgba(27,27,46,.18);backdrop-filter:blur(8px);
}
.btn-ghost:hover{
  border-color:var(--tiffany);color:var(--tiffany-deep);
  background:var(--tiffany-soft);
}
.btn-gold{
  background:linear-gradient(135deg,#E8CF8E0%,#C9A961100%);
  color:#fff;box-shadow:var(--shadow-gold);
}
.btn-gold:hover{transform:translateY(-2px)}
.btn-tg{
  background:linear-gradient(135deg,#2AABEE0%,#229ED9100%);
  box-shadow:0 12px 28px -12px rgba(42,171,238,.65);
}
.btn-tg:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 34px -12px rgba(42,171,238,.75);
}
.btn-mx{
  background:linear-gradient(135deg,#4F7FFF0%,#7B4FFF100%);
  box-shadow:0 12px 28px -12px rgba(127,79,255,.65);
}
.btn-mx:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 34px -12px rgba(127,79,255,.75);
}
.btn-call{
  background:linear-gradient(135deg,var(--ink)0%,#2E2D45100%);
  color:#fff;box-shadow:0 12px 28px -12px rgba(27,27,46,.55);
}

/* hero */
.fitness{
  padding:120px 0;
  background:linear-gradient(135deg,#F0FCFB0%,#FFF5F9100%);
  position:relative;overflow:hidden;
}
.fitness::before,
.fitness::after{
  content:"";position:absolute;
  background:radial-gradient(circle,var(--tiffany-soft),transparent70%);
  pointer-events:none;
}
.fitness::before{top:-100px;left:-100px;width:400px;height:400px}
.fitness::after{bottom:-150px;right:-100px;width:500px;height:500px}
.fitness-grid{
  display:grid;
  grid-template-columns:1fr 1.1fr;
  gap:80px;
  align-items:center;
  position:relative;z-index:1;
}
.fitness-visual{position:relative;aspect-ratio:4/5}
.fitness-photo{
  position:absolute;inset:0;
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:0 40px 80px -30px rgba(27,27,46,.4);
  background:linear-gradient(135deg,var(--tiffany-soft),var(--pink-cloud));
}
.fitness-photo img{
  width:100%;height:100%;object-fit:cover;
  transition:transform 6s;
}
.fitness-photo:hover img{transform:scale(1.06)}
.fitness-badge{
  position:absolute;background:#fff;padding:18px 22px;
  border-radius:18px;display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow-md);z-index:2;
}
.fitness-badge.fb-online{
  top:-16px;right:-24px;border:1px solid var(--tiffany-light);
  animation:floatBadge 5s ease-in-out infinite;
}
.fitness-badge.fb-care{
  bottom:30px;left:-26px;border:1px solid var(--gold-light);
  flex-direction:column;align-items:flex-start;gap:2px;
  animation:floatBadge 6s ease-in-out infinite reverse;
}
.fitness-badge.fb-method{
  bottom:30px;right:-26px;border:1px solid var(--tiffany-light);
  animation:floatBadge 6.5s ease-in-out infinite;
}
.fitness-badge svg{color:var(--tiffany-deep);flex:0 0 22px}
.fitness-badge strong{font-size:14px}
.fitness-badge small{color:var(--ink-mute);font-size:12px}

/* hero text */
.fitness-text{max-width:620px}
.fitness-kicker{
  font-family:var(--body);font-size:14px;font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;color:var(--tiffany-deep);
  margin-bottom:14px;
}
.fitness-h2{
  font-family:var(--display);
  font-size:clamp(60px,9vw,120px);
  line-height:.88;font-weight:700;letter-spacing:-.02em;
  margin:0 0 14px;
}
.fitness-h2 em{
  font-style:italic;font-weight:600;
  background:linear-gradient(120deg,var(--tiffany)0%,var(--pink)55%,var(--gold)100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:fitnessGlow 5s ease-in-out infinite;
}
@keyframes fitnessGlow{
  0%,100%{filter:drop-shadow(0 6px 18px rgba(10,186,181,.25))}
  50%{filter:drop-shadow(0 8px 24px rgba(255,111,169,.4))}
}
.fitness-sub{
  font-family:var(--display);font-style:italic;
  font-size:clamp(20px,2.2vw,28px);
  color:var(--ink-soft);margin:0 0 24px;line-height:1.3;
}
.fitness-goal{
  margin-top:28px;padding:24px 26px;
  background:linear-gradient(135deg,var(--tiffany-soft),var(--pink-cloud));
  border-radius:var(--radius);
  border:1px solid rgba(201,169,97,.3);
}
.fg-mark{
  display:inline-block;font-family:var(--display);font-style:italic;
  font-size:18px;font-weight:700;color:var(--gold-deep);margin-bottom:8px;
}
.fitness-goal p{
  font-size:16.5px;line-height:1.55;margin:0;color:var(--ink);
}
.fitness-price-badge{
  display:inline-flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,var(--tiffany-soft),var(--pink-cloud));
  border:1.5px solid rgba(201,169,97,.4);
  border-radius:var(--radius);padding:18px 28px;margin-top:24px;
}
.fpb-amount{
  font-family:var(--display);font-size:clamp(28px,3vw,40px);font-weight:700;color:var(--ink);line-height:1;
}
.fpb-label{
  font-size:13.5px;color:var(--ink-soft);line-height:1.45;
}
.fpb-label strong{display:block;font-size:15px;color:var(--ink)}

/* hero CTA */
.hero-cta{margin-top:32px}
.hero-cta .btn{margin-right:12px}

/* intro */
.smart-fitness-intro{
  padding:100px 0;background:#F8FFFA;
}
.smart-fitness-intro .eyebrow{color:var(--gold-deep);margin-bottom:12px}
.smart-fitness-intro h2{
  font-size:clamp(38px,5vw,56px);font-weight:700;line-height:1.05;margin-bottom:24px;
}
.smart-fitness-intro .lead{
  font-size:18px;color:var(--ink);max-width:720px;margin:0 auto 40px;
}
.smart-fitness-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  max-width:960px;margin-inline:auto;
}
.sf-card{
  background:#fff;border-radius:var(--radius);padding:28px 24px;
  box-shadow:var(--shadow-soft);text-align:center;transition:transform .35s;
}
.sf-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-md)}
.sf-icon{
  width:56px;height:56px;margin:0 auto 14px;
  background:linear-gradient(135deg,var(--tiffany-soft),var(--pink-cloud));
  border-radius:12px;display:grid;place-items:center;color:var(--tiffany-deep);
}
.sf-card h3{
  font-family:var(--display);font-size:20px;margin-bottom:10px;
}
.sf-card p{
  font-size:15px;color:var(--ink-soft);line-height:1.55;
}

/* benefits */
.smart-benefits{
  background:#FFF9F5;padding:100px 0;
}
.smart-benefits .eyebrow{color:var(--gold);margin-bottom:10px}
.smart-benefits h2{font-size:clamp(36px,4vw,48px);margin-bottom:32px}
.benefits-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:28px;
  max-width:1080px;margin-inline:auto;
}
.benefit-item{
  background:#fff;padding:28px 24px;border-radius:var(--radius);
  box-shadow:var(--shadow-soft);text-align:center;
}
.benefit-num{
  font-family:var(--display);font-size:38px;font-weight:600;
  background:linear-gradient(120deg,var(--tiffany),var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:12px;
}
.benefit-item p{
  font-size:15px;color:var(--ink-soft);line-height:1.5;
}

/* trends */
.smart-trends{
  background:#FAF8FF;padding:100px 0;
}
.smart-trends .eyebrow{color:var(--tiffany-deep);margin-bottom:12px}
.smart-trends h2{
  font-size:clamp(36px,4vw,48px);margin-bottom:28px;
}
.trend-graphics{margin:32px 0;text-align:center}
.trend-graphics img{
  border-radius:var(--radius);
  box-shadow:var(--shadow-soft);
  max-width:100%;
}
.trend-list{
  list-style:none;padding:0;max-width:720px;margin:auto;
  font-size:16px;color:var(--ink);line-height:1.6;
}
.trend-list li{margin-bottom:14px}
.trend-list li::before{
  content:"▶";color:var(--gold-deep);margin-right:8px;
}

/* steps */
.smart-steps{
  background:#FFF2F5;padding:100px 0;
}
.smart-steps .eyebrow{color:var(--pink-deep);margin-bottom:10px}
.smart-steps h2{font-size:clamp(34px,4vw,48px);margin-bottom:36px}
.steps-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:26px;
  max-width:960px;margin:auto;
}
.step-card{
  background:#fff;padding:28px 24px;border-radius:var(--radius);
  box-shadow:var(--shadow-soft);text-align:center;
}
.step-num{
  font-family:var(--display);font-size:42px;font-weight:700;
  background:linear-gradient(135deg,var(--tiffany),var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.step-card h3{font-size:20px;margin:14px 0 8px}
.step-card p{font-size:15px;color:var(--ink-soft);line-height:1.5}

/* online */
.fitness-online{
  margin-top:90px;padding:60px 50px;
  background:linear-gradient(135deg,#FFF0%,var(--tiffany-soft)60%,var(--pink-cloud)130%);
  border-radius:var(--radius-lg);border:1px solid rgba(10,186,181,.18);
  box-shadow:var(--shadow-soft);position:relative;overflow:hidden;
}
.fitness-online::before{
  content:"";position:absolute;top:-150px;right:-150px;
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(42,171,238,.18),transparent70%);
  pointer-events:none;
}
.fo-header{
  text-align:center;max-width:780px;margin:0 auto 50px;position:relative;z-index:1;
}
.fo-badge{
  display:inline-flex;align-items:center;gap:10px;
  padding:8px 18px;border-radius:999px;background:#fff;
  border:1px solid var(--tiffany-light);font-size:14px;font-weight:600;
  letter-spacing:.06em;color:var(--tiffany-deep);margin-bottom:18px;
  box-shadow:var(--shadow-soft);
}
.fo-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:18px;position:relative;z-index:1;
}
.fo-card{
  background:#fff;border-radius:var(--radius);padding:28px 24px;
  border:1px solid rgba(27,27,46,.05);transition:all .35s ease;position:relative;
}
.fo-card:hover{
  transform:translateY(-4px);box-shadow:var(--shadow-soft);border-color:var(--tiffany-light);
}
.fo-num{
  font-family:var(--display);font-style:italic;font-size:36px;font-weight:600;
  line-height:1;background:linear-gradient(135deg,var(--tiffany),var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;
}
.fo-card-wide{
  grid-column:span 4;display:grid;
  grid-template-columns:auto 1fr;gap:0 24px;align-items:start;
}
.fo-card-wide .fo-num{grid-row:1/ span 2}
.fo-card-wide h4{grid-column:2;margin-top:0}
.fo-card-wide p{grid-column:2}
.fo-cta{margin-top:40px;text-align:center;position:relative;z-index:1}
.fo-quote{
  font-family:var(--display);font-style:italic;
  font-size:clamp(20px,2vw,26px);line-height:1.45;color:var(--gold-deep);
  max-width:760px;margin:0 auto 24px;
}

/* FAQ */
.faq{
  background:#FCFAF7;padding:100px 0;
}
.faq-grid{
  display:grid;grid-template-columns:.9fr 1.1fr;gap:80px;align-items:start;
}
.faq-side{margin-bottom:30px}
.faq-side .eyebrow{color:var(--tiffany-deep)}
.faq-side h2{font-size:clamp(34px,4vw,48px);margin-top:12px}
.msg-choice{
  display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;
}
.msg-choice .btn{margin:0}

/* FAQ items */
.faq-item{
  border-top:1px solid rgba(27,27,46,.1);
}
.faq-q{
  font-size:1rem;padding:1rem 0;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
}
.faq-q .faq-icon{font-size:1.2rem;transition:transform .3s}
.faq-item[open] .faq-q .faq-icon{transform:rotate(45deg)}
.faq-a{
  padding:0 1rem 1rem 1rem;font-size:.95rem;color:var(--ink-soft);
}

/* analysis (lead‑magnet) */
#analysis{
  background:#F0FCFB;padding:100px 0;
}
#analysis .eyebrow{color:var(--tiffany)}
#analysis h2{font-size:clamp(34px,4vw,48px);margin-bottom:24px}
#analysis .lead{font-size:18px;color:var(--ink);max-width:720px;margin:auto}
#analysis .cta-perks{
  list-style:none;padding:0;margin:24px 0 0;
}
#analysis .cta-perks li{
  display:flex;gap:12px;align-items:center;font-size:15px;color:var(--ink-soft);
}
#analysis .cta-perks svg{flex:0 0 22px;color:var(--tiffany)}
.cta-form{
  background:#fff;padding:24px;border-radius:var(--radius);box-shadow:var(--shadow-md);
  max-width:460px;margin:32px auto 0;
}
.cta-form h3{font-size:1.2rem;margin-bottom:12px}
.cta-form .small{font-size:14px;margin-bottom:12px;color:#555}
.cta-form .input{
  width:100%;padding:12px;margin-bottom:12px;
  border:1px solid #ccc;border-radius:4px;
  font-size:15px;
}
.cta-form .consent{
  display:flex;align-items:center;font-size:14px;color:#555;margin-bottom:12px;
}
.cta-form .consent input{margin-right:8px}
.cta-form button{
  width:100%;padding:12px;background:linear-gradient(135deg,var(--tiffany),var(--pink));
  border:none;color:#fff;font-weight:600;cursor:pointer;transition:background .3s;
}
.cta-form button:disabled{opacity:.5;cursor:not-allowed}

/* contacts */
.contacts{
  background:var(--ink);color:#fff;padding:90px 0 70px;
}
.contacts h2{color:#fff}
.contacts .eyebrow{color:var(--gold-light)}
.contacts-grid{
  display:grid;grid-template-columns:1fr 1.4fr;gap:60px;margin-top:30px;
}
.contact-item{
  display:flex;gap:18px;align-items:flex-start;
}
.contact-icon{
  width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.08);
  display:grid;place-items:center;color:var(--gold-light);
}
.contact-item small{
  color:rgba(255,255,255,.55);font-size:13px;letter-spacing:.04em;
}
.contact-item strong{
  display:block;font-size:17px;font-weight:600;margin-top:2px;
}
.map-frame{
  border-radius:var(--radius);overflow:hidden;border:1px solid rgba(255,255,255,.12);
  height:380px;position:relative;
}
.btn-navigate{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--tiffany)0%,var(--tiffany-deep)100%);
  color:#fff;padding:12px 22px;border-radius:999px;font-weight:600;font-size:14px;
  box-shadow:0 8px 24px -8px rgba(10,186,181,.65);
}

/* footer */
footer{
  background:var(--ink);color:rgba(255,255,255,.6);padding:30px 0;
  border-top:1px solid rgba(255,255,255,.08);font-size:13.5px;
}
.foot-row{
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;
}

/* floating buttons */
.float-cta{
  position:fixed;right:24px;bottom:24px;z-index:40;
  width:60px;height:60px;border-radius:50%;
  background:linear-gradient(135deg,#2AABEE,#229ED9);
  display:grid;place-items:center;color:#fff;
  box-shadow:0 14px 30px -8px rgba(42,171,238,.55);
  animation:pulse 2.4s ease-out infinite;transition:transform .25s;
}
.float-cta:hover{transform:scale(1.05)}
.float-call{right:96px;background:linear-gradient(135deg,var(--gold)0%,var(--gold-light)100%)}
.float-max{
  right:168px;background:transparent;
  box-shadow:0 14px 30px -8px rgba(127,79,255,.55);
  animation:pulseMax 2.8s ease-out infinite;border-radius:14px;padding:0;
}
.float-max svg{width:60px;height:60px}
